[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-trading-benchmark"
version = "0.1.0"
description = "Point-in-time input pipeline for a multi-agent trading framework benchmark"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
benchmark-foundation = "benchmark.foundation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"benchmark.agents" = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

